ss="f1 ring" cx="460.2" cy="194.8" r="4.5"/><circle class="f1 ring" cx="570.1" cy="193.1" r="4.5"/><circle class="f1 ring" cx="680.0" cy="187.6" r="4.5"/><path class="line s2" d="M130.5 326.8 L240.4 230.5 L350.3 185.7 L460.2 159.9 L570.1 142.7 L680.0 141.7"/><circle class="f2 ring" cx="130.5" cy="326.8" r="4.5"/><circle class="f2 ring" cx="240.4" cy="230.5" r="4.5"/><circle class="f2 ring" cx="350.3" cy="185.7" r="4.5"/><circle class="f2 ring" cx="460.2" cy="159.9" r="4.5"/><circle class="f2 ring" cx="570.1" cy="142.7" r="4.5"/><circle class="f2 ring" cx="680.0" cy="141.7" r="4.5"/><text class="lead" x="142.5" y="341.8">a flat scan starts here</text><text class="note" x="734" y="70" text-anchor="end">measured streaming bandwidth 35.5 GB/s</text><line class="line s1" x1="74" y1="70" x2="94" y2="70"/><circle class="f1 ring" cx="84" cy="70" r="4"/><text class="note" x="102" y="74">sdot</text><line class="line s2" x1="224" y1="70" x2="244" y2="70"/><circle class="f2 ring" cx="234" cy="70" r="4"/><text class="note" x="252" y="74">smmla (i8mm)</text></svg>