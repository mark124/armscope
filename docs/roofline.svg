<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" role="img">
<style>
  :root {
    --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --s1: #3987e5; --s2: #d95926;
    }
  }
  .bg { fill: var(--surface); }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--ink2); }
  .tick { font-size: 11px; fill: var(--muted);
          font-variant-numeric: tabular-nums; }
  .axlab { font-size: 11.5px; fill: var(--ink2); }
  .note { font-size: 11px; fill: var(--ink2); }
  .lead { font-size: 11px; font-weight: 600; fill: var(--ink); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .roof { stroke: var(--muted); stroke-width: 1.5; fill: none; }
  .s1 { stroke: var(--s1); }
  .s2 { stroke: var(--s2); }
  .f1 { fill: var(--s1); }
  .f2 { fill: var(--s2); }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round;
          stroke-linecap: round; }
  .ring { stroke: var(--surface); stroke-width: 2; }
</style>
<rect class="bg" x="0" y="0" width="760" height="448"/><text class="title" x="74" y="26">The scan sits at the knee, not against the memory wall</text><text class="sub" x="74" y="45">one Neoverse N2 core, 400,000 vectors x 384 dims. Ceilings measured on the same core, not quoted.</text><line class="grid" x1="74" y1="363.5" x2="734" y2="363.5"/><text class="tick" x="64" y="367.5" text-anchor="end">16</text><line class="grid" x1="74" y1="283.1" x2="734" y2="283.1"/><text class="tick" x="64" y="287.1" text-anchor="end">24</text><line class="grid" x1="74" y1="226.1" x2="734" y2="226.1"/><text class="tick" x="64" y="230.1" text-anchor="end">32</text><line class="grid" x1="74" y1="145.7" x2="734" y2="145.7"/><text class="tick" x="64" y="149.7" text-anchor="end">48</text><text class="tick" x="130.5" y="410" text-anchor="middle">1</text><text class="tick" x="240.4" y="410" text-anchor="middle">2</text><text class="tick" x="350.3" y="410" text-anchor="middle">4</text><text class="tick" x="460.2" y="410" text-anchor="middle">8</text><text class="tick" x="570.1" y="410" text-anchor="middle">16</text><text class="tick" x="680.0" y="410" text-anchor="middle">32</text><line class="axis" x1="74" y1="390" x2="734" y2="390"/><text class="axlab" x="404" y="434" text-anchor="middle">arithmetic intensity (multiply-accumulates per byte read)</text><text class="axlab" x="-241" y="16" transform="rotate(-90)" text-anchor="middle">achieved G MAC/s</text><path class="roof" d="M74.0 268.1 L167.2 151.5 L734.0 151.5"/><text class="note" x="226.5" y="143.5">smmla ceiling, 47 G MAC/s</text><path class="roof" d="M74.0 268.1 L131.4 196.3 L734.0 196.3"/><text class="note" x="190.7" y="188.3">sdot ceiling, 37 G MAC/s</text><path class="line s1" d="M130.5 278.3 L240.4 231.4 L350.3 208.5 L460.2 192.0 L570.1 196.6 L680.0 191.7"/><circle class="f1 ring" cx="130.5" cy="278.3" r="4.5"/><circle class="f1 ring" cx="240.4" cy="231.4" r="4.5"/><circle class="f1 ring" cx="350.3" cy="208.5" r="4.5"/><circle class="f1 ring" cx="460.2" cy="192.0" r="4.5"/><circle class="f1 ring" cx="570.1" cy="196.6" r="4.5"/><circle class="f1 ring" cx="680.0" cy="191.7" r="4.5"/><path class="line s2" d="M130.5 282.6 L240.4 201.3 L350.3 180.4 L460.2 157.5 L570.1 143.6 L680.0 143.1"/><circle class="f2 ring" cx="130.5" cy="282.6" r="4.5"/><circle class="f2 ring" cx="240.4" cy="201.3" r="4.5"/><circle class="f2 ring" cx="350.3" cy="180.4" r="4.5"/><circle class="f2 ring" cx="460.2" cy="157.5" r="4.5"/><circle class="f2 ring" cx="570.1" cy="143.6" r="4.5"/><circle class="f2 ring" cx="680.0" cy="143.1" r="4.5"/><text class="lead" x="142.5" y="297.6">a flat scan starts here</text><text class="note" x="734" y="70" text-anchor="end">measured streaming bandwidth 37.0 GB/s</text><line class="line s1" x1="74" y1="70" x2="94" y2="70"/><circle class="f1 ring" cx="84" cy="70" r="4"/><text class="note" x="102" y="74">sdot</text><line class="line s2" x1="224" y1="70" x2="244" y2="70"/><circle class="f2 ring" cx="234" cy="70" r="4"/><text class="note" x="252" y="74">smmla (i8mm)</text></svg>