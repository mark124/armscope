name: embedding throughput

# The other half of the RAG data path. Our own CI spent 1,279 seconds embedding
# 60,200 chunks on this hardware (47 chunks/sec) because sentence-transformers
# runs PyTorch by default. ONNX Runtime's aarch64 build contains 1,724 i8mm and
# 9,572 dotprod instructions; the default Python path never reaches them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bench/embed_throughput.py"
      - ".github/workflows/embed.yml"

jobs:
  embed:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Host
        run: python tools/cpuid.py

      - name: Install
        run: |
          pip install --quiet sentence-transformers scikit-learn
          pip install --quiet "optimum[onnxruntime]" onnx onnxruntime

      - name: Confirm ONNX Runtime actually ships Arm int8 kernels
        run: |
          pip install --quiet capstone pyelftools
          python - <<'PY'
          import glob, pathlib, sys
          sys.path.insert(0, "armscope")
          import scan
          hits = glob.glob("/opt/hostedtoolcache/Python/*/arm64/lib/python*/site-packages/onnxruntime/capi/*.so")
          for h in sorted(hits):
              r = scan.scan_elf(pathlib.Path(h).read_bytes())
              if not r or r["instructions"] < 10000:
                  continue
              print(f"{h.split('/')[-1]:<34} {r['instructions']:>10,} insns "
                    f"cov {r['coverage']*100:5.1f}%  {r['features']}")
          PY

      - name: Measure
        run: python bench/embed_throughput.py | tee embed_throughput.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-throughput
          path: embed_throughput.txt
