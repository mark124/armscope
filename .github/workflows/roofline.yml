name: roofline

# Does blocking queries convert i8mm's small win into a real one?
#
# Held at a matched block factor, i8mm is worth 1.00x over SDOT on a flat scan
# and 1.29x at sixteen queries per pass. An earlier figure of 1.31x compared
# SMMLA at its 2x2 tiling against SDOT with none, so it priced the loop order
# and the instruction together, and is withdrawn.
#
# We predicted the reason was bandwidth: one multiply-accumulate per byte read
# should pin the scan against memory and leave SMMLA waiting, at about 95% of
# what the memory system can stream. That prediction is also withdrawn. Both
# ceilings measured on the same core in the same run put the scan at 54% of a
# 35.5 GB/s roof, balanced at the knee rather than against the wall.
#
# Blocking helped anyway, 2.02x for SDOT and 2.54x for SMMLA at four million
# vectors, which is why this workflow still exists: it is the sweep that
# established the matched-factor numbers above, and the roofline that
# falsified the reasoning they came from.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sq8/**"
      - "bench/blocked.py"
      - ".github/workflows/roofline.yml"

jobs:
  correctness:
    name: block factor changes nothing but speed
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Assert the scalar baseline really is scalar before anything is
      # measured against it. It was not, for weeks: compiled in with the tuned
      # kernels at -O3 +dotprod, GCC autovectorised the obvious loop into SDOT
      # and the "scalar" row landed within 2% of the hand-written SDOT one.
      - name: The scalar baseline contains no SIMD
        working-directory: sq8
        run: bash build.sh verify
      - name: Build
        working-directory: sq8
        run: |
          bash build.sh test
      - name: Run
        working-directory: sq8
        run: ./test_sq8

  sweep:
    name: sweep the block factor
    needs: correctness
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Host
        run: python3 tools/cpuid.py
      - name: Build shared library
        working-directory: sq8
        run: |
          bash build.sh lib
      - name: Install
        run: pip install --quiet numpy
      # 400k is 153MB, past this core's cache, which is where blocking has
      # something to fix. 4M is the size the live demo runs at.
      - name: Sweep at 400k
        run: |
          python bench/blocked.py 400000 | tee roofline.txt
          mv blocked.json blocked-400k.json
      - name: Sweep at demo scale
        run: |
          python bench/blocked.py 4000000 | tee roofline-4m.txt
          mv blocked.json blocked-4m.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roofline
          path: |
            roofline.txt
            roofline-4m.txt
            blocked-400k.json
            blocked-4m.json
