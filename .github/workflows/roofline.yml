name: roofline

# Does blocking queries convert i8mm's small win into a real one?
#
# Our published number is that i8mm was worth 1.31x over SDOT, which is a poor
# return on a dedicated matrix instruction. The stated reason is that a flat
# int8 scan does one multiply-accumulate per byte read, so it is pinned against
# memory bandwidth and SMMLA spends its time waiting. This tests that reading
# directly, by raising the work done per byte and seeing whether throughput
# follows, with both ceilings measured on the same core.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sq8/**"
      - "bench/blocked.py"
      - ".github/workflows/roofline.yml"

jobs:
  correctness:
    name: block factor changes nothing but speed
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Assert the scalar baseline really is scalar before anything is
      # measured against it. It was not, for weeks: compiled in with the tuned
      # kernels at -O3 +dotprod, GCC autovectorised the obvious loop into SDOT
      # and the "scalar" row landed within 2% of the hand-written SDOT one.
      - name: The scalar baseline contains no SIMD
        working-directory: sq8
        run: bash build.sh verify
      - name: Build
        working-directory: sq8
        run: |
          bash build.sh test
      - name: Run
        working-directory: sq8
        run: ./test_sq8

  sweep:
    name: sweep the block factor
    needs: correctness
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Host
        run: python3 tools/cpuid.py
      - name: Build shared library
        working-directory: sq8
        run: |
          bash build.sh lib
      - name: Install
        run: pip install --quiet numpy
      # 400k is 153MB, past this core's cache, which is where blocking has
      # something to fix. 4M is the size the live demo runs at.
      - name: Sweep at 400k
        run: python bench/blocked.py 400000 | tee roofline.txt
      - name: Sweep at demo scale
        run: |
          python bench/blocked.py 4000000 | tee roofline-4m.txt
          mv blocked.json blocked-4m.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roofline
          path: |
            roofline.txt
            roofline-4m.txt
            blocked.json
            blocked-4m.json
